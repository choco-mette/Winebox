<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e3440"/>
      <stop offset="100%" stop-color="#1b1f29"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#62a0ea"/>
      <stop offset="100%" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c54a0"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ed333b"/>
      <stop offset="100%" stop-color="#8e101c"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bg)"/>

  <!-- Open Box Back Inner -->
  <polygon points="64,28 100,45 64,62 28,45" fill="#1c3d6e" stroke="#99c1f1" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Wine glass rising inside the open box -->
  <path d="M51 31 H77 L74 47 C72.5 54 68.5 58 64 58 C59.5 58 55.5 54 54 47 Z"
        fill="url(#wine)" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M53 41 Q64 37 75 41 L73.5 47 C72 53 68 57 64 57 C60 57 56 53 54.5 47 Z"
        fill="#f66151" opacity="0.55"/>
  <rect x="62" y="57.5" width="4" height="11" fill="#ffffff"/>
  <ellipse cx="64" cy="69" rx="10" ry="2.6" fill="#ffffff"/>

  <!-- Box Front Faces (cradling the wine glass) -->
  <polygon points="28,45 64,62 64,102 28,85" fill="url(#boxLeft)" stroke="#99c1f1" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="100,45 64,62 64,102 100,85" fill="url(#boxRight)" stroke="#99c1f1" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Open Box Side Flaps -->
  <polygon points="28,45 18,54 54,71 64,62" fill="#99c1f1" opacity="0.88" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="100,45 110,54 74,71 64,62" fill="#62a0ea" opacity="0.92" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
